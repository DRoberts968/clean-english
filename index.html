<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean English</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Clean English</h1>
        <p class="subtitle">Rewrite your text into clear, natural English</p>
        
        <div class="input-section">
            <label for="inputText">Paste or type your text:</label>
            <textarea id="inputText" placeholder="Enter your text here..."></textarea>
        </div>
        
        <div class="button-group">
            <button id="cleanBtn" class="btn btn-primary">Clean English</button>
            <button id="clearBtn" class="btn btn-clear">Clear</button>
        </div>
        
        <div class="output-section" id="outputSection" style="display: none;">
            <label for="outputText">Cleaned English:</label>
            <textarea id="outputText" readonly></textarea>
            <button id="copyBtn" class="btn btn-secondary">Copy</button>
        </div>
        
        <div id="message" class="message"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
